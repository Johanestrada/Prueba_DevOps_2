name: CD - Deploy to AWS EKS
on:
  push:
    branches:
      - feature/ci-cd
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      PROJECT_NAME: prueba_devops_2
      EKS_CLUSTER_NAME: prueba_devops_2-eks-cluster # Alineado con el nombre del proyecto en Terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: account
        run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Set image names
        run: |
          echo "ECR_REGISTRY=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_ENV
          echo "ECR_REPO_VENTAS=${{ env.PROJECT_NAME }}-ventas-back" >> $GITHUB_ENV
          echo "ECR_REPO_DESPACHOS=${{ env.PROJECT_NAME }}-despachos-back" >> $GITHUB_ENV
          echo "ECR_REPO_FRONTEND=${{ env.PROJECT_NAME }}-frontend" >> $GITHUB_ENV

      - name: Export Terraform variables to job env
        run: |
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_project_name=${{ env.PROJECT_NAME }}" >> $GITHUB_ENV
          echo "TF_VAR_key_pair_name=${{ secrets.KEY_PAIR_NAME }}" >> $GITHUB_ENV
          echo "TF_VAR_mysql_root_password=${{ secrets.MYSQL_ROOT_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_mysql_database=${{ secrets.MYSQL_DATABASE }}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: '1.5.7'

      - name: Terraform Init (configure remote backend)
        working-directory: infra/terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_mysql_database: ${{ secrets.MYSQL_DATABASE }}
          TF_VAR_key_pair_name: ${{ secrets.KEY_PAIR_NAME }}
          TF_VAR_project_name: ${{ env.PROJECT_NAME }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ secrets.TF_LOCK_TABLE }}
        run: |
          set -e
          # Ensure S3 bucket for remote state exists
          if ! aws s3api head-bucket --bucket "$TF_STATE_BUCKET" 2>/dev/null; then
            echo "Creating S3 bucket for Terraform state: $TF_STATE_BUCKET"
            aws s3api create-bucket --bucket "$TF_STATE_BUCKET" --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }} || true
          else
            echo "S3 bucket $TF_STATE_BUCKET already exists"
          fi

          # Ensure DynamoDB table for state locking exists
          if ! aws dynamodb describe-table --table-name "$TF_LOCK_TABLE" 2>/dev/null; then
            echo "Creating DynamoDB table for Terraform locking: $TF_LOCK_TABLE"
            aws dynamodb create-table --table-name "$TF_LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST || true
            # wait for table active
            aws dynamodb wait table-exists --table-name "$TF_LOCK_TABLE" || true
          else
            echo "DynamoDB table $TF_LOCK_TABLE already exists"
          fi

          # Init terraform with remote backend
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=${{ env.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=$TF_LOCK_TABLE"

      - name: Import existing ECR repos into Terraform state (if present)
        working-directory: infra/terraform
        run: |
          set -e
          FRONT=${ECR_REPO_FRONTEND}
          VENTAS=${ECR_REPO_VENTAS}
          DESPACHOS=${ECR_REPO_DESPACHOS}

          echo "Checking ECR repo: $FRONT"
          if ! terraform state list | grep -q "aws_ecr_repository.frontend"; then
            if aws ecr describe-repositories --repository-names "$FRONT" >/dev/null 2>&1; then
              echo "Importing $FRONT into terraform state as aws_ecr_repository.frontend"
              terraform import aws_ecr_repository.frontend "$FRONT" || true
            else
              echo "$FRONT not present - will be created by Terraform"
            fi
          else
            echo "aws_ecr_repository.frontend already in state"
          fi

          echo "Checking ECR repo: $VENTAS"
          if ! terraform state list | grep -q "aws_ecr_repository.ventas_back"; then
            if aws ecr describe-repositories --repository-names "$VENTAS" >/dev/null 2>&1; then
              echo "Importing $VENTAS into terraform state as aws_ecr_repository.ventas_back"
              terraform import aws_ecr_repository.ventas_back "$VENTAS" || true
            else
              echo "$VENTAS not present - will be created by Terraform"
            fi
          else
            echo "aws_ecr_repository.ventas_back already in state"
          fi

          echo "Checking ECR repo: $DESPACHOS"
          if ! terraform state list | grep -q "aws_ecr_repository.despachos_back"; then
            if aws ecr describe-repositories --repository-names "$DESPACHOS" >/dev/null 2>&1; then
              echo "Importing $DESPACHOS into terraform state as aws_ecr_repository.despachos_back"
              terraform import aws_ecr_repository.despachos_back "$DESPACHOS" || true
            else
              echo "$DESPACHOS not present - will be created by Terraform"
            fi
          else
            echo "aws_ecr_repository.despachos_back already in state"
          fi

      - name: Import existing EKS cluster into Terraform state (if present)
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # Try several possible cluster names and also scan existing clusters
          echo "Looking for existing EKS cluster to import..."
          if terraform state list | grep -q "aws_eks_cluster.eks"; then
            echo "aws_eks_cluster.eks already in state"
            exit 0
          fi

          candidates=()
          if [ -n "${EKS_CLUSTER_NAME:-}" ]; then
            candidates+=("$EKS_CLUSTER_NAME")
          fi
          candidates+=("${PROJECT_NAME}-eks-cluster")
          candidates+=("app-eks-cluster")

          # add clusters from AWS that contain project name or 'eks'
          mapfile -t aws_clusters < <(aws eks list-clusters --region ${{ env.AWS_REGION }} --output text | tr '\t' '\n' 2>/dev/null || true)
          for c in "${aws_clusters[@]:-}"; do
            # prefer clusters that include the project name
            if [[ "$c" == *"${PROJECT_NAME}"* ]] || [[ "$c" == *"eks"* ]]; then
              candidates+=("$c")
            fi
          done

          tried=()
          for name in "${candidates[@]}"; do
            # avoid duplicates
            if [[ " ${tried[*]} " == *" $name "* ]]; then
              continue
            fi
            tried+=("$name")
            echo "Checking cluster candidate: $name"
            if aws eks describe-cluster --name "$name" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
              echo "Found cluster $name, importing into terraform state as aws_eks_cluster.eks[0]"
              terraform import 'aws_eks_cluster.eks[0]' "$name"
              echo "Import completed. Current terraform state entries:" 
              terraform state list || true
              exit 0
            else
              echo "$name not present in AWS (or insufficient permissions)"
            fi
          done

          echo "No existing EKS cluster found to import. Terraform will attempt to create one."

      - name: Terraform Apply
        working-directory: infra/terraform
        run: |
          terraform apply -input=false -auto-approve
          EKS_NAME=$(terraform output -raw eks_cluster_name 2>/dev/null || echo "")
          if [ -n "$EKS_NAME" ]; then
            echo "EKS_CLUSTER_NAME<<EOF" >> $GITHUB_ENV
            echo "$EKS_NAME" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Diagnose EKS cluster presence
        run: |
          aws sts get-caller-identity --output text
          aws eks list-clusters --region ${{ env.AWS_REGION }} || true
          echo "EKS_CLUSTER_NAME is: $EKS_CLUSTER_NAME"
          if [ -z "$EKS_CLUSTER_NAME" ]; then
            echo "EKS_CLUSTER_NAME not set (terraform may have failed)."
            exit 1
          fi
          if ! aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region ${{ env.AWS_REGION }} >/dev/null 2>&1; then
            echo "EKS cluster '$EKS_CLUSTER_NAME' not found in this account/region."
            exit 1
          fi

      - name: Ensure ECR repositories exist
        run: |
          repos=("${{ env.ECR_REPO_VENTAS }}" "${{ env.ECR_REPO_DESPACHOS }}" "${{ env.ECR_REPO_FRONTEND }}")
          for r in "${repos[@]}"; do
            aws ecr describe-repositories --repository-names "$r" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$r"
          done

      - name: Build and Push ventas backend image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_VENTAS }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_VENTAS }}:latest \
            ./back-Ventas_SpringBoot/Springboot-API-REST --push

      - name: Build and Push despachos backend image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_DESPACHOS }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_DESPACHOS }}:latest \
            ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO --push

      - name: Build and Push frontend image
        run: |
          docker buildx build --platform linux/amd64 \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:latest \
            ./front_despacho --push

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Create db-secret from GitHub Secrets
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
        run: |
          kubectl create namespace app --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic db-secret \
            --from-literal=SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
            --from-literal=SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
            --namespace app --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f infra/k8s/ --namespace app

      - name: Update deployment images
        run: |
          IMAGE_VENTAS=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_VENTAS }}:${{ github.sha }}
          IMAGE_DESPACHOS=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_DESPACHOS }}:${{ github.sha }}
          IMAGE_FRONTEND=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO_FRONTEND }}:${{ github.sha }}
          kubectl set image deployment/ventas-deployment ventas=$IMAGE_VENTAS -n app
          kubectl set image deployment/despachos-deployment despachos=$IMAGE_DESPACHOS -n app
          kubectl set image deployment/frontend-deployment frontend=$IMAGE_FRONTEND -n app

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/ventas-deployment -n app
          kubectl rollout status deployment/despachos-deployment -n app
          kubectl rollout status deployment/frontend-deployment -n app
