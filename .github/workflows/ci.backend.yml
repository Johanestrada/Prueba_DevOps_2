# Nombre del flujo de trabajo que aparecerá en la pestaña "Actions" de GitHub
name: CI - Backend Build & Test

# Define cuándo se debe ejecutar este flujo de trabajo
on:
  # Se activa cada vez que se hace un push a la rama 'develop'
  push:
    branches: [ "develop" ]
  # También permite ejecutarlo manualmente desde la UI de GitHub
  workflow_dispatch:

# Define los "trabajos" (jobs) que se ejecutarán
jobs:
  # Primer trabajo: construir y probar el servicio de ventas
  build-test-ventas:
    # El trabajo se ejecutará en una máquina virtual con la última versión de Ubuntu
    runs-on: ubuntu-latest
    steps:
      # 1. Clona tu repositorio en la máquina virtual
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configura el entorno de Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Ejecuta las pruebas de Maven para el servicio de ventas
      - name: Run tests for Ventas service
        run: mvn -f back-Ventas_SpringBoot/Springboot-API-REST/pom.xml test

  # Segundo trabajo: construir y probar el servicio de despachos (se ejecuta en paralelo al de ventas)
  build-test-despachos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run tests for Despachos service
        run: mvn -f back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO/pom.xml test

