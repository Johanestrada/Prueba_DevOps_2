services:

  mysql:
    image: mysql:8

    container_name: mysql-db

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ventasdb

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - academia-net

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5



  ventas-back:
    build:
      context: ./back-Ventas_SpringBoot
      dockerfile: Dockerfile

    image: ventas-back:1.0

    container_name: ventas-back

    restart: unless-stopped

    ports:
      - "8081:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ventasdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - academia-net



  despachos-back:
    build:
      context: ./back-Despachos_SpringBoot
      dockerfile: Dockerfile

    image: despachos-back:1.0

    container_name: despachos-back

    restart: unless-stopped

    ports:
      - "8082:8080"

    networks:
      - academia-net



  frontend:
    build:
      context: ./front_despacho
      dockerfile: Dockerfile

    image: frontend-despacho:1.0

    container_name: frontend-despacho

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - ventas-back

    networks:
      - academia-net



volumes:
  mysql_data:



networks:
  academia-net:
    driver: bridge