apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: 387380359607.dkr.ecr.us-east-1.amazonaws.com/inventario-devops-frontend:latest
        ports:
        - containerPort: 80
        env:
        - name: VENTAS_BACK_HOST
          value: ventas-service:80
        - name: DESPACHOS_BACK_HOST
          value: despachos-service:80
