apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - host: example.local
    http:
      paths:
      - path: /api/despachos
        pathType: Prefix
        backend:
          service:
            name: despachos-service
            port:
              number: 80
      - path: /api/ventas
        pathType: Prefix
        backend:
          service:
            name: ventas-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
